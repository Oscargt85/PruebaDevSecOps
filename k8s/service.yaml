apiVersion: v1
kind: Service
metadata:
  name: springboot-microservice
  labels:
    app: springboot-microservice
spec:
  type: ClusterIP
  selector:
    app: springboot-microservice
  ports:
    - name: http
      port: 80
      targetPort: 8080
    - name: metrics
      port: 8081
      targetPort: 8081