apiVersion: apps/v1
kind: Deployment
metadata:
  name: springboot-microservice
spec:
  replicas: 1
  selector:
    matchLabels:
      app: springboot-microservice
  template:
    metadata:
      labels:
        app: springboot-microservice
  spec:
    containers:
      - name: springboot-microservice
        image: ghcr.io/oscargt85/springboot-microservice:v1
        ports:
          - containerPort: 8080