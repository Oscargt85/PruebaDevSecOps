apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: springboot-microservice
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Oscargt85/PruebaDevSecOps.git
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: springboot
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true