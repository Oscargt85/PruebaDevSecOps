name: Build and Deploy Spring Boot Microservice

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - 'k8s/**'
  pull_request:
    branches: [ "main", "develop" ]

env:
  IMAGE_NAME: ghcr.io/oscargt85/springboot-microservice

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write     # para hacer commit del nuevo tag en k8s/
      packages: write     # para publicar en GHCR
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Compilar con Maven
        run: mvn clean package -DskipTests

      - name: Login en GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y push de imagen Docker
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest

      - name: Actualizar tag de imagen en manifiestos
        if: github.event_name == 'push'
        run: |
          sed -i "s|newTag:.*|newTag: \"${{ github.sha }}\"|" k8s/kustomization.yaml
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add k8s/kustomization.yaml
          git commit -m "deploy: ${{ github.sha }} [skip ci]" || echo "Sin cambios"
          git push