name: Build and Deploy Spring Boot Microservice

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - 'helm/**'

env:
  IMAGE_NAME: ghcr.io/oscargt85/springboot-microservice
  VALUES_FILE: helm/springboot-microservice/values.yaml

concurrency:
  group: build-main
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Compilar con Maven
        run: mvn clean package -DskipTests

      - name: Construir imagen (sin publicar)
        run: |
          docker build \
            -t ${{ env.IMAGE_NAME }}:${{ github.sha }} \
            -t ${{ env.IMAGE_NAME }}:latest .

      - name: Trivy - escanear imagen
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

      - name: Trivy - escanear Dockerfile y manifiestos
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: config
          scan-ref: .
          format: table
          severity: CRITICAL,HIGH
          exit-code: '0'

      - name: Login en GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar imagen
        run: |
          docker push ${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.IMAGE_NAME }}:latest

      - name: Actualizar image.tag en values.yaml (GitOps)
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          for i in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            sed -i "s|^  tag:.*|  tag: \"${{ github.sha }}\"|" ${{ env.VALUES_FILE }}
            git add ${{ env.VALUES_FILE }}
            git commit -m "deploy: ${{ github.sha }} [skip ci]" || { echo "Sin cambios"; exit 0; }
            git push origin HEAD:main && exit 0
            echo "Push rechazado, reintentando ($i/3)..."
            sleep 3
          done
          echo "No se pudo actualizar el tag"
          exit 1
