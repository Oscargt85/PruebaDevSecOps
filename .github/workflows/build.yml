name: Build Spring Boot Microservice

on:
  #push:
    #branches: [ "feature/test" ]
  pull_request:
    branches: [ "develop" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v3

      - name: Configurar JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Compilar con Maven
        run: mvn clean package -DskipTests

      - name: Login en Azure Container Registry
        uses: azure/docker-login@v1
        with:
          login-server: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Construir y push de imagen Docker
        run: |
          docker build -t ${{ secrets.ACR_LOGIN_SERVER }}/springboot-microservice:${{ github.sha }} .
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/springboot-microservice:${{ github.sha }}
